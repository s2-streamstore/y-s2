name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure R2 bucket for deployment
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          test -n "$R2_BUCKET_NAME" || { echo "R2_BUCKET_NAME secret is not set"; exit 1; }
          sed -i "s/\"bucket_name\": \"test\"/\"bucket_name\": \"$R2_BUCKET_NAME\"/" wrangler.jsonc
          grep -q "\"bucket_name\": \"$R2_BUCKET_NAME\"" wrangler.jsonc

      # Secrets are uploaded atomically with the new version via --secrets-file,
      # instead of a separate `wrangler secret bulk` call before the deploy.
      - name: Write secrets file
        env:
          S2_ACCESS_TOKEN: ${{ secrets.S2_ACCESS_TOKEN }}
          S2_BASIN: ${{ secrets.S2_BASIN }}
        run: |
          test -n "$S2_ACCESS_TOKEN" || { echo "S2_ACCESS_TOKEN secret is not set"; exit 1; }
          test -n "$S2_BASIN" || { echo "S2_BASIN secret is not set"; exit 1; }
          jq -n '{S2_ACCESS_TOKEN: env.S2_ACCESS_TOKEN, S2_BASIN: env.S2_BASIN}' > "$RUNNER_TEMP/secrets.json"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
